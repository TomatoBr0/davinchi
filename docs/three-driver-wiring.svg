<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200">
<defs><style>text{font-family:Arial,sans-serif;fill:#18332e;font-size:18px}.title{font-size:32px;font-weight:bold}.head{font-size:23px;font-weight:bold}.small{font-size:16px}.net{font-family:monospace;font-weight:bold}.box{fill:#fff;stroke:#24483f;stroke-width:2}.wire{fill:none;stroke:#24483f;stroke-width:2}.power{stroke:#b64735;stroke-width:3;fill:none}.logic{stroke:#266b9b;stroke-width:3;fill:none}.warn{fill:#fff3dd;stroke:#ba8431;stroke-width:2}</style></defs>
<rect width="1500" height="1200" fill="#f3f5ef"/>
<text x="45" y="52" class="title">DA VINCI • UNO + THREE SALVAGED A4988 DRIVERS</text>
<text x="45" y="84">Proposed wiring • based on all repo documentation at 3c299c0 • NOT READY TO ENERGIZE</text>
<rect x="40" y="110" width="1420" height="78" rx="10" class="warn"/>
<text x="60" y="140">UNRESOLVED: B2–B6 header mapping, RESET/SLEEP state, microstep settings, motor current and PSU output pins.</text>
<text x="60" y="167">Front/component side: writing upright; “12V” at upper-left, “ENA” lower-left, “DIR” lower-right. Verify EACH board.</text>
<!-- supply block -->
<rect x="40" y="220" width="400" height="265" rx="12" class="box"/>
<text x="60" y="255" class="head">AcBel FLXA5201A PSU</text>
<text x="60" y="287">Use measured low-voltage outputs only.</text>
<text x="60" y="318">+12 V ─ fuse* ─ DC cutoff*</text>
<path d="M340 313H410V350H470" class="power"/>
<text x="60" y="358" class="net">MOTOR_12V</text>
<text x="60" y="392" class="net">PSU DC GND → COMMON_GND</text>
<text x="60" y="426" class="small">*Ratings selected for wires and measured load.</text>
<text x="60" y="454" class="small">No wire-color / enable-pin assumptions.</text>
<!-- uno -->
<rect x="40" y="515" width="400" height="385" rx="12" class="box"/>
<text x="60" y="550" class="head">Elegoo Arduino Uno</text>
<text x="60" y="583">USB power + host connection</text>
<text x="60" y="625" class="net">D2 → X_STEP   D5 → X_DIR</text>
<text x="60" y="661" class="net">D3 → Y_STEP   D6 → Y_DIR</text>
<text x="60" y="697" class="net">D4 → Z_STEP   D7 → Z_DIR</text>
<text x="60" y="738" class="net">D8 → ENABLE_N (all boards)</text>
<text x="60" y="776" class="net">3.3V → LOGIC_3V3 (all boards)</text>
<text x="60" y="814" class="net">GND → COMMON_GND</text>
<text x="60" y="850" class="small">Do not connect printer +12 V to Uno 5V.</text>
<text x="60" y="878" class="small">Do not join PSU 3.3 V to Uno 3.3 V.</text>
<!-- notes -->
<rect x="40" y="930" width="400" height="225" rx="12" class="warn"/>
<text x="60" y="963" class="head">Net-label schematic</text>
<text x="60" y="995">Identical labels mean connected wires.</text>
<text x="60" y="1027">Use a logic distribution point for 3.3 V.</text>
<text x="60" y="1059">Motor returns go directly to PSU ground,</text>
<text x="60" y="1087">not through the Uno or a breadboard.</text>
<text x="60" y="1125" class="small">Current limit: Ipeak = VREF / 1.6 A/V</text>
<rect x="505" y="220" width="660" height="265" rx="12" class="box"/>
<text x="525" y="253" class="head">X • 3DP01 MOTOR R2 / A4988</text>
<text x="525" y="285" class="net">T1 12V ← MOTOR_12V</text>
<text x="525" y="317" class="net">T2 GND ← COMMON_GND</text>
<text x="525" y="349" class="net">T7 VDD ← LOGIC_3V3</text>
<text x="525" y="381" class="net">T8 GND ← COMMON_GND</text>
<text x="525" y="418" class="net">B1 ENA ← ENABLE_N</text>
<text x="525" y="449" class="net">B7 STEP ← X_STEP</text>
<text x="890" y="449" class="net">B8 DIR ← X_DIR</text>
<text x="890" y="285">T3 2B</text><text x="890" y="317">T4 2A</text>
<text x="890" y="349">T5 1A</text><text x="890" y="381">T6 1B</text>
<path d="M975 280H1250 M975 312H1250 M975 344H1250 M975 376H1250" class="wire"/>
<rect x="1250" y="260" width="180" height="143" rx="12" class="box"/>
<text x="1270" y="293" class="head">X motor</text>
<text x="1270" y="329">2B / 2A: coil B</text>
<text x="1270" y="363">1A / 1B: coil A</text>
<text x="890" y="414" class="small">B2–B6: NOT MAPPED</text>
<rect x="505" y="515" width="660" height="265" rx="12" class="box"/>
<text x="525" y="548" class="head">Y • 3DP01 MOTOR R2 / A4988</text>
<text x="525" y="580" class="net">T1 12V ← MOTOR_12V</text>
<text x="525" y="612" class="net">T2 GND ← COMMON_GND</text>
<text x="525" y="644" class="net">T7 VDD ← LOGIC_3V3</text>
<text x="525" y="676" class="net">T8 GND ← COMMON_GND</text>
<text x="525" y="713" class="net">B1 ENA ← ENABLE_N</text>
<text x="525" y="744" class="net">B7 STEP ← Y_STEP</text>
<text x="890" y="744" class="net">B8 DIR ← Y_DIR</text>
<text x="890" y="580">T3 2B</text><text x="890" y="612">T4 2A</text>
<text x="890" y="644">T5 1A</text><text x="890" y="676">T6 1B</text>
<path d="M975 575H1250 M975 607H1250 M975 639H1250 M975 671H1250" class="wire"/>
<rect x="1250" y="555" width="180" height="143" rx="12" class="box"/>
<text x="1270" y="588" class="head">Y motor</text>
<text x="1270" y="624">2B / 2A: coil B</text>
<text x="1270" y="658">1A / 1B: coil A</text>
<text x="890" y="709" class="small">B2–B6: NOT MAPPED</text>
<rect x="505" y="810" width="660" height="265" rx="12" class="box"/>
<text x="525" y="843" class="head">Z • 3DP01 MOTOR R2 / A4988</text>
<text x="525" y="875" class="net">T1 12V ← MOTOR_12V</text>
<text x="525" y="907" class="net">T2 GND ← COMMON_GND</text>
<text x="525" y="939" class="net">T7 VDD ← LOGIC_3V3</text>
<text x="525" y="971" class="net">T8 GND ← COMMON_GND</text>
<text x="525" y="1008" class="net">B1 ENA ← ENABLE_N</text>
<text x="525" y="1039" class="net">B7 STEP ← Z_STEP</text>
<text x="890" y="1039" class="net">B8 DIR ← Z_DIR</text>
<text x="890" y="875">T3 2B</text><text x="890" y="907">T4 2A</text>
<text x="890" y="939">T5 1A</text><text x="890" y="971">T6 1B</text>
<path d="M975 870H1250 M975 902H1250 M975 934H1250 M975 966H1250" class="wire"/>
<rect x="1250" y="850" width="180" height="143" rx="12" class="box"/>
<text x="1270" y="883" class="head">Z motor</text>
<text x="1270" y="919">2B / 2A: coil B</text>
<text x="1270" y="953">1A / 1B: coil A</text>
<text x="890" y="1004" class="small">B2–B6: NOT MAPPED</text>
<text x="510" y="1110" class="small">AT EACH BOARD: capacitor ≥47 µF, ≥25 V: positive to T1; negative to T2; short leads.</text>
<text x="510" y="1138" class="small">Proposed bias: ENABLE_N → 10 kΩ → LOGIC_3V3; verify onboard pulls. HIGH disables outputs.</text>
<text x="510" y="1166" class="small">RESET/SLEEP and microstep wiring still required after mapping. No hot-plugging. Test one motor first.</text>
</svg>